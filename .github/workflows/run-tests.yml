name: run-tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        php: [8.5, 8.4, 8.3, 8.2, 8.1]
        laravel: [13.*, 12.*, 11.*, 10.*, 9.*, 8.*]
        stability: [prefer-stable]
        include:
          - laravel: 13.*
            testbench: 11.*
          - laravel: 12.*
            testbench: 10.*
          - laravel: 11.*
            testbench: 9.*
          - laravel: 10.*
            testbench: 8.*
          - laravel: 9.*
            testbench: ^7.0
          - laravel: 8.*
            testbench: ^6.6
        exclude:
          - php: 8.1
            laravel: 11.*
          - php: 8.1
            laravel: 12.*
          - php: 8.1
            laravel: 13.*
          - php: 8.2
            laravel: 13.*
          - php: 8.3
            laravel: 8.*
          - php: 8.3
            laravel: 9.*
          - php: 8.4
            laravel: 8.*
          - php: 8.4
            laravel: 9.*
          - php: 8.4
            laravel: 10.*
          - php: 8.5
            laravel: 8.*
          - php: 8.5
            laravel: 9.*
          - php: 8.5
            laravel: 10.*
          - php: 8.5
            laravel: 11.*

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.stability }} - ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo
          coverage: none

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Install dependencies
        run: |
          # EOL Laravel lines have no patched release; ignored only in this package's CI test install, consumers unaffected.
          case "${{ matrix.laravel }}" in
            11.*|10.*)
              composer config policy.advisories.ignore-id \
                PKSA-d5tc-s1qs-h781 PKSA-m5cs-t1y6-qpcs PKSA-3r5d-mb8f-1qw9 PKSA-mdq4-51ck-6kdq
              ;;
            9.*)
              composer config policy.advisories.ignore-id \
                PKSA-d5tc-s1qs-h781 PKSA-m5cs-t1y6-qpcs PKSA-3r5d-mb8f-1qw9 PKSA-mdq4-51ck-6kdq \
                PKSA-8qx3-n5y5-vvnd
              ;;
            8.*)
              composer config policy.advisories.ignore-id \
                PKSA-d5tc-s1qs-h781 PKSA-m5cs-t1y6-qpcs PKSA-3r5d-mb8f-1qw9 \
                PKSA-8qx3-n5y5-vvnd PKSA-w9tt-7782-78jx
              ;;
          esac
          composer update --with="laravel/framework:${{ matrix.laravel }}" --with="orchestra/testbench:${{ matrix.testbench }}" --${{ matrix.stability }} --prefer-dist --no-interaction

      - name: Execute tests
        run: vendor/bin/phpunit
